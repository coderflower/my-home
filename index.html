<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>我的家 · 三维户型</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23b0835a' stroke-width='2'%3E%3Cpath d='M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="viewport"></div>

    <header class="topbar">
      <button id="btn-panel" class="icon-btn mobile-only" title="房间">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="title">
        <h1>我的家</h1>
        <span>三室两厅一卫 · 建面 102 m² · 套内净面积 <b id="total-area"></b></span>
      </div>
    </header>

    <aside class="panel">
      <h2>房间</h2>
      <ul id="room-list"></ul>
      <p class="note">户型取自贝壳 VR 实测数据，尺寸按开发商 CAD 校正，家具为示意。<br />点击门扇可开关门，点击地面可定位房间。</p>
    </aside>

    <nav class="toolbar">
      <div class="group">
        <button id="btn-3d" class="icon-btn" title="三维视角">
          <svg viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 12l9-5M12 12v10M12 12L3 7"/></svg>
        </button>
        <button id="btn-top" class="icon-btn" title="俯视">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h9V3M12 12v9"/></svg>
        </button>
        <button id="btn-reset" class="icon-btn" title="重置视角">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
      </div>
      <div class="group">
        <button data-wall="auto" class="text-btn" title="遮挡视线的墙自动变透明">自动墙</button>
        <button data-wall="low" class="text-btn" title="墙体只保留 1 米高">矮墙</button>
        <button data-wall="full" class="text-btn" title="完整墙体">全墙</button>
      </div>
      <div class="group">
        <button id="btn-plan" class="icon-btn" title="叠加原始户型图">
          <svg viewBox="0 0 24 24"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>
        </button>
        <button id="btn-labels" class="icon-btn" title="房间名称">
          <svg viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
        </button>
        <button id="btn-night" class="icon-btn" title="夜晚">
          <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </nav>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
